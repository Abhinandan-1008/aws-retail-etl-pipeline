name: Deploy Retail ETL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Glue script to S3
        run: |
          aws s3 cp glue/glue_job.py s3://retail-etl-raw-2026-014/scripts/glue_job.py

      - name: Update Lambda function code
        run: |
          cd lambda
          zip -r ../lambda.zip .
          cd ..
          ls -lh lambda.zip
          unzip -l lambda.zip
          aws lambda update-function-code \
            --function-name RetailETL-Trigger-Lambda \
            --zip-file fileb://$GITHUB_WORKSPACE/lambda.zip